<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forsyth Connect — Find Community Resources</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark">FC</span>
        <span class="brand-name">Forsyth Connect</span>
      </div>
      <p class="tagline">One place to find food, health, housing, and education help near you.</p>
    </div>
  </header>

  <!-- ===== SEARCH + FILTERS ===== -->
  <section class="controls">
    <div class="controls-inner">
      <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Search by name, need, or keyword..."
        aria-label="Search resources"
      >

      <div class="filter-chips" id="filterChips">
        <!-- Filter buttons are generated by script.js based on categories in the data -->
      </div>
    </div>
  </section>

  <!-- ===== RESULTS COUNT ===== -->
  <div class="results-bar">
    <span id="resultsCount"></span>
  </div>

  <!-- ===== RESOURCE GRID ===== -->
  <main class="resource-grid" id="resourceGrid">
    <!-- Resource cards are generated by script.js -->
  </main>

  <!-- ===== EMPTY STATE (shown when no results match) ===== -->
  <div class="empty-state" id="emptyState" hidden>
    <p>No resources match that search.</p>
    <p class="empty-sub">Try a different keyword, or clear the category filter above.</p>
  </div>

  <!-- ===== RESOURCE DETAIL MODAL ===== -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      <span class="modal-category" id="modalCategory"></span>
      <h2 id="modalTitle"></h2>
      <p id="modalDescription"></p>
      <dl class="modal-details">
        <div>
          <dt>Address</dt>
          <dd id="modalAddress"></dd>
        </div>
        <div>
          <dt>Phone</dt>
          <dd id="modalPhone"></dd>
        </div>
        <div>
          <dt>Hours</dt>
          <dd id="modalHours"></dd>
        </div>
      </dl>
    </div>
  </div>

  <footer class="site-footer">
    <p>Built by students, for our community. Forsyth Connect — Congressional App Challenge 2026.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
